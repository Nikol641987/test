name: Watch tournament page

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check page
        run: node check.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save baseline
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add baseline.json
          git diff --staged --quiet || (git commit -m "update baseline" && git push)

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main
